name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
